name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      node: ${{ steps.check.outputs.node }}
      java: ${{ steps.check.outputs.java }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          test -f requirements.txt && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          test -f package.json     && echo "node=true"   >> "$GITHUB_OUTPUT" || echo "node=false"   >> "$GITHUB_OUTPUT"
          { test -f pom.xml || test -f build.gradle; } && echo "java=true" >> "$GITHUB_OUTPUT" || echo "java=false" >> "$GITHUB_OUTPUT"

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check . || true   # remove "|| true" once the code is clean
      - name: Test
        run: pytest -q || echo "No tests yet — add some."

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm test --if-present

  java:
    needs: detect
    if: needs.detect.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: |
          if [ -f pom.xml ]; then mvn -B verify
          else ./gradlew build
          fi
